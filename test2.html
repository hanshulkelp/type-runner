<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Test - Player 2</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
  <h2>Player 2</h2>
  <button onclick="connect()">1. Connect</button>
  <button onclick="joinRoom()">2. Join Room</button>
  <button onclick="ready()">3. Ready</button>
  <pre id="log" style="background:#111;color:#0f0;padding:10px;height:400px;overflow:auto"></pre>

  <script>
    let socket;

    const TOKEN   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1YjdlYTdlZS02YWI0LTQ4MmEtYmIwNC04YTUxZmY1MTZkYTQiLCJ1c2VybmFtZSI6InRlc3R1c2VyMiIsImlhdCI6MTc3Mjk1NDc3NSwiZXhwIjoxNzcyOTU2NTc1fQ.0QSDEtwz0Ys5LTSBnXXq0clBmLY54AhujpexAxAn54M';
    const ROOM_ID = 'tT9-XtXt_nDz';

    function log(msg) {
      const pre = document.getElementById('log');
      pre.textContent += '\n' + JSON.stringify(msg, null, 2);
      pre.scrollTop = pre.scrollHeight;
    }

    function connect() {
      socket = io('http://localhost:3000', { auth: { token: TOKEN } });

      socket.on('connect',           () => log('✅ connected: ' + socket.id));
      socket.on('disconnect',        () => log('❌ disconnected'));
      socket.on('roomState',         data => log({ event: 'roomState', data }));
      socket.on('playerJoined',      data => log({ event: 'playerJoined', data }));
      socket.on('countdown',         data => log({ event: 'countdown', data }));
      socket.on('raceStart',         data => log({ event: 'raceStart', data }));
      socket.on('progressBroadcast', data => log({ event: 'progressBroadcast', data }));
      socket.on('raceEnd',           data => log({ event: 'raceEnd', data }));
      socket.on('error',             data => log({ event: 'error', data }));
    }

    function joinRoom() {
      socket.emit('joinRoom', { roomId: ROOM_ID });
    }

    function ready() {
      socket.emit('playerReady', { roomId: ROOM_ID });
    }
  </script>
</body>
</html>
